# popcorn workflow: Plan → Design → Build → Test → Publish → Review → Deploy
#
# popcorn enforces this file with hooks. The agent can't skip a phase, can't finish a phase
# before its artifacts, agent outputs and gates are in place, can't edit outside a phase's
# paths, and can't run guarded commands or MCP tools (push, merge) until they are unlocked.
#
# Everything is visible on GitHub: Publish pushes the branch popcorn/{task} and opens a pull
# request, the reviewers' findings are posted on it, and Deploy merges it only once every
# reviewer agent approves. Publish, Review and Deploy use a GitHub MCP server from your
# project's .mcp.json (see the README), or the `gh` CLI.
#
# Edit it freely: add, remove or reorder phases, change gates and agents. Then run /popcorn:validate.
# {task} is the run's name, e.g. p1-user-login.
version: 1
name: agile-pr
description: User story → technical design → test-first build → hardening and gates → pull request → three-reviewer review on the PR → merge once every reviewer approves.

policy:
  # Never allowed, in any phase.
  deny_shell:
    - "git push --force*"
    - "git push -f*"
    - "git reset --hard*"
    - "git clean -fd*"
    - "rm -rf /*"
    # Best effort: the reviewer agents' definitions and the MCP config can't be changed from the shell.
    - "*.claude/agents*"
    - "*.claude/settings*"
    - "*.mcp.json*"
  # Never editable by the agent during a run. The reviewers' approval unlocks the merge, so the agent
  # must not be able to rewrite a reviewer (agent names resolve to .claude/agents/<name>.md first).
  protect_paths:
    - ".claude/agents/**"
    - ".claude/settings*.json"
    - ".mcp.json"
  # Allowed only in a phase that lists them in allow.guarded, after you approve that phase.
  guarded_shell:
    - "git push*"
    - "git merge*"
    - "gh pr merge*"
    - "gh api*"
  # MCP tools ("<server>:<tool>") allowed only in a phase that unlocks them. These cover the GitHub
  # MCP server's tools that merge or write to a branch without a local push.
  guarded_mcp:
    - "*:merge_pull_request"
    - "*:push_files"
    - "*:create_or_update_file"
    - "*:delete_file"
    - "*:create_branch"
    - "*:update_pull_request_branch"
  # How often the agent may try to finish an incomplete phase before the run waits for you.
  max_attempts_per_phase: 3
  # Review findings with these severities send the run back to the phase's on_fail.
  blocking_severities: [BLOCKER, CRITICAL, HIGH]
  # A reviewer that doesn't approve also sends the run back: merging needs every reviewer's approval.
  blocking_verdicts: [changes_requested]
  gate_timeout_seconds: 900

phases:
  - id: plan
    title: Plan
    agent: product-manager
    goal: Turn the request into a user story with acceptance criteria.
    instructions: |
      Write docs/plans/{task}.md with a "## Story" section: the user story ("As a <role>, I want
      <capability>, so that <benefit>"), acceptance criteria as observable behaviour
      (Given/When/Then), out of scope, dependencies and open questions for the user.
    artifacts: ["docs/plans/{task}.md"]
    allow:
      edit: ["docs/**"]

  - id: design
    title: Design
    agent: architect
    goal: Decide how to build it, and get the plan approved.
    instructions: |
      Add a "## Design" section to docs/plans/{task}.md: the approach, invariants mapped to tests,
      ordered build steps (each with one command that proves it), the files or directories it will
      touch, and risks. Then summarise the plan for the user.
    artifacts: ["docs/plans/{task}.md"]
    approval: after
    allow:
      edit: ["docs/**"]

  - id: build
    title: Build
    agent: implementer
    goal: Implement the design test-first, one build step per commit.
    instructions: |
      Work on the branch popcorn/{task} (create it from main if it doesn't exist). Follow the build
      steps in docs/plans/{task}.md. For each step, write a failing test first, then the code that
      makes it pass, then commit the step.
    gates:
      - "npm test" # replace with your project's test command

  - id: test
    title: Test
    agent: test-engineer
    goal: Harden the tests and pass the full quality gate.
    instructions: |
      Add edge-case and error-path tests for the change. Check that each new test fails when the
      line it covers is broken, then restore it. Commit the tests.
    gates:
      - "npm test" # e.g. "npm run lint && npm run typecheck && npm test"

  - id: publish
    title: Publish
    goal: Push the branch and open a pull request, so the change is visible on GitHub.
    instructions: |
      Push popcorn/{task} to origin (`git push -u origin popcorn/{task}`). If it has no open pull
      request into main yet, open one with the GitHub MCP server's create_pull_request tool (or
      `gh pr create`): the story as the title, and a body with a summary, a link to
      docs/plans/{task}.md and the test results. If the pull request already exists (a fix round),
      comment on it with what changed since the last review. Never push main.
    gates:
      # The remote branch is at this commit, so the reviewers see what was built.
      - 'test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/popcorn/{task} | cut -f1)"'
    unlock_after: test
    allow:
      edit: ["docs/**"]
      guarded: ["git push*"]
    deny:
      # Best effort: a bare `git push` while on main isn't caught. Protect main on GitHub as well.
      shell: ["git push* main", "git push* main *", "git push*:main", "git push*:main *",
              "git push* master", "git push* master *", "git push*:master", "git push*:master *",
              "git push*--all*", "git push*--mirror*"]

  - id: review
    title: Review
    goal: Get the pull request reviewed for correctness, quality and security, on GitHub.
    instructions: |
      Run the three reviewers in parallel on `git diff main...HEAD`. Each one writes its result
      file. Once all three have, post each reviewer's result on the pull request as its own review
      with event COMMENT (GitHub MCP pull_request_review_write, or `gh pr review --comment`): the
      reviewer's name and verdict, then each finding with its severity, file, line and fix, as
      inline comments where a finding has a file and line. If any reviewer doesn't approve, popcorn
      sends the run back to Build with the findings.
    outputs:
      schema: review
      required: [code-reviewer, quality-reviewer, security-reviewer]
    on_fail: build
    allow:
      edit: [".popcorn/outputs/**"]

  - id: deploy
    title: Deploy
    goal: Merge the pull request that every reviewer approved.
    instructions: |
      Every reviewer approved. Merge the pull request for popcorn/{task} with the GitHub MCP
      server's merge_pull_request tool (merge method "merge"), or `gh pr merge --merge`. Then switch
      to main, pull, run the test command and report what was shipped, with the pull request link.
    gates:
      # The branch is merged into main on GitHub.
      - "git fetch -q origin main && git merge-base --is-ancestor popcorn/{task} origin/main"
    unlock_after: review
    allow:
      guarded: ["*:merge_pull_request", "gh pr merge*"]

schemas:
  review:
    type: object
    required: [verdict, findings]
    properties:
      verdict: { enum: [approve, changes_requested] }
      findings:
        type: array
        items:
          type: object
          required: [severity, title]
          properties:
            severity: { enum: [BLOCKER, CRITICAL, HIGH, MEDIUM, LOW] }
            title: { type: string }
            file: { type: string }
            line: { type: integer }
            fix: { type: string }
